<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" style="background:#0B132B;">
  <defs>
    <!-- 背景流光与径向渐变 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="60%" stop-color="#1C2541" />
      <stop offset="100%" stop-color="#0B132B" />
    </linearGradient>

    <radialGradient id="glowRadial" cx="75%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D8FF" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#00D8FF" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cornerGlow" cx="15%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>

    <!-- 粒子光晕滤镜 -->
    <filter id="glowFilter" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- 32px 科技网格纹理图案 -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.035)" stroke-width="1"/>
      <circle cx="40" cy="0" r="1.5" fill="rgba(255, 255, 255, 0.08)"/>
    </pattern>
  </defs>

  <!-- 1. 背景层 -->
  <rect width="1600" height="900" fill="url(#bgGrad)"/>
  <rect width="1600" height="900" fill="url(#techGrid)"/>
  <rect width="1600" height="900" fill="url(#glowRadial)"/>
  <rect width="1600" height="900" fill="url(#cornerGlow)"/>

  <!-- 2. 精致极简边框与刻度装饰 -->
  <rect x="50" y="50" width="1500" height="800" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5"/>
  <rect x="65" y="65" width="1470" height="770" rx="10" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" stroke-dasharray="8 8"/>

  <!-- 四角标尺十字线 -->
  <g stroke="#00D8FF" stroke-width="2" opacity="0.65">
    <path d="M 40 60 L 60 60 M 60 40 L 60 60" />
    <path d="M 1560 60 L 1540 60 M 1540 40 L 1540 60" />
    <path d="M 40 840 L 60 840 M 60 860 L 60 840" />
    <path d="M 1560 840 L 1540 840 M 1540 860 L 1540 840" />
  </g>

  <!-- 3. 右侧核心科技矢量艺术插画 -->
  
        <g transform="translate(1180, 450)">
          <!-- React 环形多维轨道 -->
          <ellipse rx="220" ry="85" fill="none" stroke="#00D8FF" stroke-width="2.5" opacity="0.85" transform="rotate(30)"/>
          <ellipse rx="220" ry="85" fill="none" stroke="#00D8FF" stroke-width="2.5" opacity="0.85" transform="rotate(90)"/>
          <ellipse rx="220" ry="85" fill="none" stroke="#00D8FF" stroke-width="2.5" opacity="0.85" transform="rotate(150)"/>
          <circle r="26" fill="#00D8FF" opacity="0.95" filter="url(#glowFilter)"/>
          <circle r="14" fill="#FFFFFF"/>
          <!-- 外层光晕环 -->
          <circle r="270" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="4 8" opacity="0.4"/>
        </g>
      

  <!-- 4. 左侧文章出版级信息与标题排版 -->
  <g transform="translate(120, 150)">
    <!-- 顶部徽章胶囊与分类 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="220" height="38" rx="6" fill="#00D8FF" fill-opacity="0.15" stroke="#00D8FF" stroke-width="1.5" stroke-opacity="0.7"/>
      <circle cx="20" cy="19" r="4.5" fill="#00D8FF"/>
      <text x="36" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#00D8FF" letter-spacing="1.5">FRONTEND ARCHITECTURE</text>
    </g>

    <text x="240" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="rgba(255,255,255,0.45)" letter-spacing="2">CHENT.CO ARCHITECTURE SERIES</text>

    <!-- 中文主标题 -->
    <g transform="translate(0, 160)">
      
        <text x="0" y="30" font-family="'MiSans', 'PingFang SC', -apple-system, sans-serif" font-size="56" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">SolidJS 细粒度响应式前端探索</text>
      
    </g>

    <!-- 装饰分隔标尺 -->
    <g transform="translate(0, 360)">
      <line x1="0" y1="0" x2="160" y2="0" stroke="#00D8FF" stroke-width="3" opacity="0.9"/>
      <line x1="170" y1="0" x2="680" y2="0" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    </g>

    <!-- 标签与技术栈标记 -->
    <g transform="translate(0, 420)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#38BDF8" opacity="0.95" letter-spacing="1">TAGS: SolidJS  ·  JavaScript  ·  响应式原理</text>
      <text x="0" y="36" font-family="monospace" font-size="14" fill="rgba(255,255,255,0.4)" letter-spacing="1.2">SYSTEM / ARCHITECTURE / CLOUD-NATIVE / ENGINEERING</text>
    </g>

    <!-- 底部品牌与作者水印 -->
    <g transform="translate(0, 540)">
      <circle cx="12" cy="12" r="10" fill="none" stroke="#00D8FF" stroke-width="2"/>
      <circle cx="12" cy="12" r="4" fill="#00D8FF"/>
      <text x="32" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" letter-spacing="2">CHENT.CO</text>
      <text x="140" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="rgba(255,255,255,0.4)">· 序栈 深度工程技术文稿</text>
    </g>
  </g>
</svg>